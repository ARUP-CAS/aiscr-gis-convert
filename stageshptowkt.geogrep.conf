<VirtualHost *:80>
    ServerName stageshptowkt.geogrep.cz
    ServerAdmin webmaster@geogrep.cz

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =stageshptowkt.geogrep.cz
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName stageshptowkt.geogrep.cz
    ServerAdmin webmaster@geogrep.cz

    SSLCertificateFile /etc/letsencrypt/live/stageshptowkt.geogrep.cz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/stageshptowkt.geogrep.cz/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyRequests Off
    ProxyPreserveHost On

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "stageshptowkt.geogrep.cz"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s

    # API routes → Express server
    ProxyPass /upload http://localhost:3006/upload nocanon
    ProxyPassReverse /upload http://localhost:3006/upload

    ProxyPass /upload-dxf http://localhost:3006/upload-dxf nocanon
    ProxyPassReverse /upload-dxf http://localhost:3006/upload-dxf

    ProxyPass /upload-gpx http://localhost:3006/upload-gpx nocanon
    ProxyPassReverse /upload-gpx http://localhost:3006/upload-gpx

    # Frontend → nginx kontejner
    ProxyPass / http://localhost:8081/
    ProxyPassReverse / http://localhost:8081/

    ErrorLog ${APACHE_LOG_DIR}/stageshptowkt_error.log
    CustomLog ${APACHE_LOG_DIR}/stageshptowkt_access.log combined
</VirtualHost>
